name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Montar projeto Android
        run: |
          set -e

          echo "Verificando arquivos do JotaPhone..."

          test -f index.html || {
            echo "ERRO: index.html não encontrado na raiz do repositório"
            exit 1
          }

          test -f firebase-config.js || {
            echo "ERRO: firebase-config.js não encontrado"
            exit 1
          }

          test -f online.js || {
            echo "ERRO: online.js não encontrado"
            exit 1
          }

          test -f player.js || {
            echo "ERRO: player.js não encontrado"
            exit 1
          }

          test -f jotaphone-icon.png || {
            echo "ERRO: jotaphone-icon.png não encontrado"
            exit 1
          }

          mkdir -p app/src/main
