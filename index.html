<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--f:1;--bgc:#6c5ce7;--bg:linear-gradient(160deg,#6c5ce7,#fd79a8);--card:#fff;--soft:#f1efff;--ink:#2d2a4a;--tx:#fff;--bd:#d8d3ff;--pri:#009e7e;--prid:#006b56;--onp:#fff;--sec:#fdcb6e;--secd:#c99a2e;--ons:#111;--mix:#e84393;--mixd:#b02570;--onm:#fff;--hot:#ffeaa7;--er:#ff7675}

.scr{display:flex;flex-direction:column;gap:12px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--card);color:var(--ink);border:2px solid var(--bd);border-radius:24px;padding:16px;box-shadow:0 8px 24px #0003}
.b{border:0;border-radius:20px;padding:16px;font:inherit;font-weight:800;font-size:calc(20px*var(--f));line-height:1.1;color:var(--onp);background:var(--c,var(--pri));box-shadow:0 6px 0 var(--d,var(--prid));cursor:pointer;transition:.1s;width:100%}
.b:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d,var(--prid))}
.y,.o{--c:var(--sec);--d:var(--secd);color:var(--ons)}.g{--c:var(--pri);--d:var(--prid);color:var(--onp)}.p{--c:var(--mix);--d:var(--mixd);color:var(--onm)}
.sm{font-size:calc(16px*var(--f));padding:10px 16px;width:auto}
input,select{width:100%;box-sizing:border-box;border:3px solid var(--bd);border-radius:16px;padding:12px;font:inherit;font-size:calc(18px*var(--f));background:var(--soft);color:var(--ink);margin-bottom:6px}
input[type=color]{height:56px;padding:4px}
label{font-weight:800;font-size:calc(15px*var(--f))}
.av{display:inline-block;border-radius:50%;overflow:hidden;flex:none;vertical-align:middle}.av svg{width:100%;height:100%;display:block}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avs .av{width:100%;aspect-ratio:1;border:4px solid transparent;box-sizing:border-box;cursor:pointer;transition:.15s;position:relative}
.avs .av.sel{border-color:var(--sec);transform:scale(1.1);animation:pop .3s}
.avs .av.sel::after{content:'✓';position:absolute;right:2px;bottom:2px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:var(--onp);font:800 14px/22px sans-serif;text-align:center}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.row{display:flex;align-items:center;gap:10px}.row>*{min-width:0}
.pl{background:var(--soft);border-radius:16px;padding:8px 12px;font-weight:700;font-size:calc(18px*var(--f))}
.logo{font-size:calc(54px*min(var(--f),1.1));font-weight:800;text-align:center;line-height:1.05;text-shadow:0 4px 0 #0003}
.mas{text-align:center;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.code{font-size:calc(52px*min(var(--f),1.1));letter-spacing:8px;font-weight:800;color:var(--pri)}
.tm{font-size:calc(60px*min(var(--f),1.1));font-weight:800;text-align:center;color:var(--tx);text-shadow:0 3px 0 #0004;line-height:1}
.tm.hot{color:var(--hot);animation:pulse .5s infinite alternate}.tm.hot::after{content:' ⏰'}@keyframes pulse{to{transform:scale(1.15)}}
canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:16px;touch-action:none;box-shadow:0 4px 0 #0002;display:block}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw{border:3px solid transparent;background:var(--soft);color:var(--ink);border-radius:14px;padding:4px 0;font:inherit;cursor:pointer;min-width:0}
.sw i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 2px;border:3px solid var(--ink);font-style:normal;font-weight:800;font-size:calc(20px*var(--f));line-height:28px;text-align:center}
.sw small{font-size:calc(11px*var(--f));display:block;line-height:1.1;overflow-wrap:anywhere}
.sw.sel{border-color:var(--ink);background:var(--sec);color:var(--ons);animation:pop .3s}.sw.sel i::after{content:'✓'}
.tl{border:0;background:var(--soft);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;font-size:calc(16px*var(--f));cursor:pointer}
.tl.sel{background:var(--sec);color:var(--ons);outline:3px solid var(--ink)}.tl.sel::before{content:'✓ '}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:16px;z-index:9;animation:in .2s;font-weight:700;max-width:90%}
.err{color:var(--er);font-weight:800;text-align:center;min-height:1em}
.step img{width:100%;border-radius:16px;background:#fff;display:block;margin-top:8px}
.q{font-size:calc(22px*var(--f));font-weight:700;margin-top:6px}
.arr{text-align:center;font-size:calc(30px*var(--f));animation:bob 1.5s infinite}
.pop{animation:pop .4s}
.c{text-align:center;font-weight:700}
.gr{text-align:right}
.ok,.bad{font-weight:800;border:2px solid currentColor;border-radius:12px;padding:4px 10px}.ok{color:var(--pri)}.bad{color:var(--er)}
.pvw{border-radius:20px;padding:14px;background:var(--bg);background-color:var(--bgc);color:var(--tx);display:flex;flex-direction:column;gap:10px;border:3px solid var(--bd)}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.hc .b,html.hc .tl,html.hc .sw,html.hc input,html.hc select{border:3px solid #fff}

}

S(bg('#d6f5e3')+'<circle cx="25" cy="27" r="11" fill="#222"/><circle cx="75" cy="27" r="11" fill="#222"/><circle cx="50" cy="56" r="33" fill="#fff" stroke="#222" stroke-width="2"/><ellipse cx="36" cy="51" rx="9" ry="12" fill="#222" transform="rotate(20 36 51)"/><ellipse cx="64" cy="51" rx="9" ry="12" fill="#222" transform="rotate(-20 64 51)"/><circle cx="37" cy="50" r="4" fill="#fff"/><circle cx="63" cy="50" r="4" fill="#fff"/><ellipse cx="50" cy="64" rx="6" ry="4.5" fill="#222"/>'+smile(71,7)),
S(bg('#fff3a3')+'<circle cx="30" cy="36" r="15" fill="#4cc94f"/><circle cx="70" cy="36" r="15" fill="#4cc94f"/><ellipse cx="50" cy="62" rx="37" ry="27" fill="#4cc94f"/><circle cx="30" cy="35" r="9" fill="#fff"/><circle cx="70" cy="35" r="9" fill="#fff"/><circle cx="32" cy="37" r="4.5" fill="#222"/><circle cx="68" cy="37" r="4.5" fill="#222"/><path d="M20 62Q50 90 80 62" stroke="#1d6b22" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="24" cy="68" r="5" fill="#ff9ebd" opacity=".7"/><circle cx="76" cy="68" r="5" fill="#ff9ebd" opacity=".7"/><circle cx="46" cy="52" r="1.6" fill="#1d6b22"/><circle cx="54" cy="52" r="1.6" fill="#1d6b22"/>')
,S(bg('#d8d8e8')+'<circle cx="28" cy="31" r="15" fill="#8f8f9b"/><circle cx="72" cy="31" r="15" fill="#8f8f9b"/><circle cx="28" cy="31" r="9" fill="#f2b8c6"/><circle cx="72" cy="31" r="9" fill="#f2b8c6"/><ellipse cx="50" cy="58" rx="31" ry="29" fill="#a9a9b5"/>'+eyes(54,13,5)+'<ellipse cx="50" cy="64" rx="5" ry="4" fill="#ef7190"/><path d="M50 68v5M42 74Q50 79 58 74" stroke="#333" stroke-width="2.5" fill="none"/><path d="M18 64h22M16 71l24-4M82 64H60M84 71l-24-4" stroke="#555" stroke-width="2"/>')
,S(bg('#d7e8ff')+'<defs><radialGradient id="blk" cx="35%" cy="28%"><stop offset="0" stop-color="#666"/><stop offset=".38" stop-color="#222"/><stop offset="1" stop-color="#050505"/></radialGradient></defs><circle cx="50" cy="52" r="34" fill="url(#blk)" stroke="#111" stroke-width="3"/><ellipse cx="38" cy="38" rx="9" ry="5" fill="#fff" opacity=".25"/><circle cx="39" cy="54" r="5.5" fill="#fff"/><circle cx="61" cy="54" r="5.5" fill="#fff"/><circle cx="40" cy="55" r="2.5" fill="#111"/><circle cx="60" cy="55" r="2.5" fill="#111"/>'+smile(67,8))
,S(bg('#ffe1bd')+'<defs><radialGradient id="brn" cx="35%" cy="25%"><stop offset="0" stop-color="#7a4b2a"/><stop offset=".5" stop-color="#312016"/><stop offset="1" stop-color="#090807"/></radialGradient></defs><circle cx="50" cy="53" r="35" fill="url(#brn)" stroke="#17110e" stroke-width="3"/><path d="M25 37Q50 20 76 39" stroke="#9a6338" stroke-width="5" opacity=".55" fill="none"/><ellipse cx="38" cy="53" rx="8" ry="10" fill="#fff"/><ellipse cx="62" cy="53" rx="8" ry="10" fill="#fff"/><circle cx="40" cy="56" r="3.5" fill="#111"/><circle cx="60" cy="56" r="3.5" fill="#111"/><path d="M40 70Q50 77 60 70" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>')
];
const av=(i,s)=>`<span class="av" style="width:${s}px;height:${s}px">${AV[i]}</span>`;
const MAS='<svg viewBox="0 0 80 100" width="86"><path d="M40 12V3" stroke="#2d2a4a" stroke-width="3"/><circle cx="40" cy="4" r="4" fill="#ff7675"/><rect x="12" y="12" width="56" height="84" rx="16" fill="#ff9f1c" stroke="#2d2a4a" stroke-width="3"/><rect x="20" y="22" width="40" height="56" rx="10" fill="#fff6d6"/><circle cx="31" cy="44" r="5" fill="#222"/><circle cx="49" cy="44" r="5" fill="#222"/><circle cx="32.5" cy="42.5" r="1.6" fill="#fff"/><circle cx="50.5" cy="42.5" r="1.6" fill="#fff"/><path d="M29 55Q40 69 51 55Z" fill="#e84393" stroke="#222" stroke-width="2"/><circle cx="40" cy="87" r="4" fill="#fff6d6"/></svg>';
/* ---------- util ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1900)}
const err=m=>{m='✕ '+m;const e=$('#er');e?e.textContent=m:toast(m)};
const ok=()=>ensurePlayer();
const genCode=()=>Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
const sel=(id,arr,def,f=x=>x)=>`<select id="${id}">${arr.map(x=>`<option value="${x}"${x==def?' selected':''}>${f(x)}</option>`).join('')}</select>`;
const pubL=()=>Object.entries(dir).filter(([c,r])=>Date.now()-r.ts<4000&&(!NATIVE||(r.pub&&r.ph==='lobby'))).map(([c,r])=>({...r,code:c}));
const stepType=s=>s%2?'draw':'text';
/* ---------- "servidor" (o host da sala) ---------- */
const act=(k,d)=>{if(isH())return hh(k,me.id,d);if(playMode==='online')return JotaOnline.enviarAcaoOnline(room.code,me.id,k,d).catch(e=>toast('✕ '+e.message));post({t:'act',code:room.code,from:me.id,k,d})};
function beat(){if(playMode==='online')return;const r=room,h=r.players.find(p=>p.id===r.host);if(NATIVE)JotaLan.ad(JSON.stringify({code:r.code,name:r.name,pub:r.pub?1:0,ph:r.phase,max:r.max,n:r.players.length,host:{name:h.name,av:h.av}}));post({t:'hbh',code:r.code,ad:r.pub&&r.phase==='lobby'?{name:r.name,max:r.max,n:r.players.length,host:{name:h.name,av:h.av}}:null})}
function push(){if(!room)return;if(playMode==='online'){JotaOnline.definirEstadoSalaOnline(room.code,room).catch(e=>toast('✕ '+e.message));sync();return}post({t:'state',room});beat();sync()}
function removeP(id){const r=room;r.players=r.players.filter(p=>p.id!==id);delete seen[id];if(!r.players.length){room=null;return}if(r.host===id)r.host=r.players[0].id}
function hostLeave(){const r=room;if(!r)return;const code=r.code;r.players=r.players.filter(p=>p.id!==me.id);if(r.players.length){r.host=r.players[0].id;if(playMode==='online')JotaOnline.definirEstadoSalaOnline(code,r).catch(()=>{});else post({t:'state',room:r})}else if(playMode==='online')JotaOnline.apagarSalaOnline(code).catch(()=>{});room=null;if(playMode==='online')stopOnlineWatch();if(playMode==='local'&&NATIVE)setTimeout(()=>{closeWs();JotaLan.stopRelay()},500)}
function checkAdv(){const r=room;if(r.phase==='play'&&r.order.every(id=>!r.players.some(p=>p.id===id)||r.done.includes(id)))adv()}
function adv(){const r=room,N=r.order.length,s=r.step,ty=stepType(s);
 r.order.forEach((id,p)=>r.chains[((p-s)%N+N)%N].push({by:id,type:ty,data:pend[id]||''}));
 pend={};r.done=[];r.step++;
 if(r.step>=r.steps){r.phase='results';r.v={c:0,i:0,d:0}}else r.deadline=Date.now()+(stepType(r.step)==='draw'?r.draw:WT)*1000}
function hh(k,from,d){const r=room;if(!r||r.host!==me.id)return;const H=from===r.host;
 if(k==='hb'){seen[from]=Date.now();if(!hbs[from]){hbs[from]=1;push()}return}
 if(k==='leave'){removeP(from);if(room&&room.phase==='play')checkAdv()}
 else if(k==='submit'&&r.phase==='play'&&d.step===r.step&&!r.done.includes(from)){pend[from]=d.data;r.done.push(from);checkAdv()}
 else if(k==='start'&&H&&r.phase==='lobby'&&r.players.length>1){const N=r.players.length;r.order=r.players.map(p=>p.id);r.info={};r.players.forEach(p=>r.info[p.id]={name:p.name,av:p.av});
  r.steps=Math.max(2,Math.min(r.rounds,N));r.chains=r.order.map(()=>[]);r.phase='play';r.step=0;r.done=[];pend={};r.deadline=Date.now()+WT*1000}
 else if(k==='next'&&H&&r.phase==='results'){const v=r.v;if(v.i+1<r.chains[v.c].length)v.i++;else if(v.c+1<r.chains.length){v.c++;v.i=0}else v.d=1}
 else if(k==='again'&&H&&r.phase==='results'){r.phase='lobby';r.chains=[];r.done=[];r.order=[]}
 if(room)push()}
/* ---------- rede (BroadcastChannel entre abas) ---------- */
function closeWs(){closing=1;try{ws&&ws.close()}catch(e){}ws=null}
function conn(ip,cb){closing=0;try{ws&&ws.close()}catch(e){}let op=0,dn=0;const w=new WebSocket('ws://'+ip+':8765');ws=w;
 w.onopen=()=>{op=dn=1;cb&&cb(true)};
 w.onmessage=e=>{try{bc.onmessage({data:JSON.parse(e.data)})}catch(x){}};

/* ---------- temas e configurações ---------- */
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)),rg=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mx=(a,b,t)=>{const x=hx(a),y=hx(b);return rg(x.map((v,i)=>v+(y[i]-v)*t))},ra=(c,a)=>`rgba(${hx(c).join(',')},${a})`;
const lum=c=>{const[r,g,b]=hx(c).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const on=c=>cr(c,'#ffffff')>=3?'#ffffff':'#111111';
const fix=(c,b,min=4.5)=>{const t=lum(b)<.4?'#ffffff':'#000000';let k=0;while(cr(c,b)<min&&k++<25)c=mx(c,t,.1);return c};
const LI={b1:'#6c5ce7',b2:'#fd79a8',card:'#ffffff',soft:'#f1efff',ink:'#2d2a4a',tx:'#ffffff',bd:'#d8d3ff',pri:'#009e7e',sec:'#fdcb6e',mix:'#e84393',hot:'#ffeaa7',logo:['#ffeaa7','#ff7675','#74b9ff','#55efc4']};
const DK={b1:'#0d0d12',b2:'#1a1530',card:'#1c1c26',soft:'#2a2a38',ink:'#f2f2f7',tx:'#f2f2f7',bd:'#3d3d52',pri:'#2ec4a0',sec:'#e5b94e',mix:'#e0709f',hot:'#ffd166',logo:['#2ec4a0','#e5b94e','#e0709f','#74b9ff']};
const HC={b1:'#000000',b2:'#000000',card:'#000000',soft:'#1a1a1a',ink:'#ffffff',tx:'#ffffff',bd:'#ffffff',pri:'#ffe600',sec:'#00e5ff',mix:'#ffffff',hot:'#ffe600'};
const CB={pro:['#0072B2','#E69F00','#56B4E9'],deu:['#0072B2','#E69F00','#56B4E9'],tri:['#C2185B','#00838F','#E65100']};
const P={lava:{n:'Lava',e:'🌋',c1:'#e63946',c2:'#111111',d:1},noite:{n:'Noite',e:'🌙',c1:'#2a6fdb',c2:'#0a0a14',d:1},neon:{n:'Neon',e:'⚡',c1:'#9b5cff',c2:'#18c8ff',d:1},floresta:{n:'Floresta',e:'🌲',c1:'#2e9e4f',c2:'#0b0f0c',d:1},sol:{n:'Sol',e:'☀️',c1:'#ffb400',c2:'#ff7a00',d:0},ceu:{n:'Céu',e:'☁️',c1:'#3aa0ff',c2:'#ffffff',d:0},algodao:{n:'Algodão Doce',e:'🍬',c1:'#ff7eb6',c2:'#b07cff',c3:'#5ee7ff',d:0}};
function gen(c1,c2,c3,d){let o;
 if(d){const b1=mx(c1,'#000000',.74),b2=mx(c2,'#000000',.55),bc=mx(b1,b2,.5),card=mx(mx(bc,c2,.12),'#ffffff',.07);o={b1,b2,card,soft:mx(card,'#ffffff',.1),ink:'#f4f4fa',tx:'#f4f4fa',bd:fix(c1,card,3)}}
 else{const b1=mx(c1,'#ffffff',.4),b2=mx(c2,'#ffffff',.5),b3=c3&&mx(c3,'#ffffff',.45),bc=mx(b1,b2,.5),card=mx(c2,'#ffffff',.9);o={b1,b2,b3,card,soft:mx(c2,'#ffffff',.8),ink:on(card),tx:on(bc),bd:mx(c1,card,.5)}}
 const s=cr(c2,o.card)<2?mx(c1,d?'#ffffff':'#000000',.35):c2;
 o.pri=fix(c1,o.card,3);o.sec=fix(s,o.card,3);o.mix=fix(c3||mx(o.pri,o.sec,.5),o.card,3);o.hot=fix(mx(c1,'#ffffff',d?.3:0),mx(o.b1,o.b2,.5),3);return o}
function mk(o){const bc=mx(o.b1,o.b2,.5),g=[o.b1,o.b3,o.b2].filter(Boolean).join(',');
 const v={'--bgc':bc,'--bg':`radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.5px) 0 0/30px 30px,radial-gradient(circle at 15% 6%,${ra(o.pri,.4)},transparent 45%),radial-gradient(circle at 92% 96%,${ra(o.sec,.35)},transparent 50%),linear-gradient(${o.b3?135:160}deg,${g})`,'--card':o.card,'--soft':o.soft,'--ink':o.ink,'--tx':o.tx,'--bd':o.bd,'--hot':o.hot,'--er':fix('#ff4d4d',o.card,4.5)};
 for(const k of['pri','sec','mix']){v['--'+k]=o[k];v['--'+k+'d']=mx(o[k],'#000000',.35);v['--on'+k[0]]=on(o[k])}
 return{v,logo:o.logo||[o.pri,o.sec,o.mix,o.hot].map(c=>fix(c,bc,3)),dark:lum(bc)<.35}}
function themeOf(sp){let id=sp.id,o;if(id==='auto')id=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
 if(ST.cb==='hc')o=HC;else if(id==='light')o=LI;else if(id==='dark')o=DK;else{const q=P[id]||sp;o=gen(q.c1,q.c2,q.c3,q.d!=null?q.d:(lum(q.c1)+lum(q.c2))/2<.2)}
 if(CB[ST.cb]){const[a,b,c]=CB[ST.cb];o={...o,pri:fix(a,o.card,3),sec:fix(b,o.card,3),mix:fix(c,o.card,3),logo:null}}
 return mk(o)}
const FS=[.88,1,1.2,1.4],vs=t=>Object.entries(t.v).map(([k,v])=>k+':'+v).join(';');
function applyT(){T=themeOf({id:ST.theme,c1:ST.c1,c2:ST.c2});const el=document.documentElement;for(const k in T.v)el.style.setProperty(k,T.v[k]);el.style.setProperty('--f',FS[ST.font]);el.classList.toggle('calm',!!ST.calm);el.classList.toggle('hc',ST.cb==='hc');el.style.colorScheme=T.dark?'dark':'light'}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(ST.theme==='auto'){applyT();render()}});
const buzz=(p,k)=>{if(k&&!ST[k])return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function snd(){if(!ST.snd)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=520;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.06)}catch(e){}}
const rr=()=>{const y=scrollY;render();scrollTo(0,y)};
const chip=(g,a,v,l,cur)=>`<button class="tl${v==cur?' sel':''}" data-g="${g}" data-a="${a}" data-v="${v}">${l}</button>`;
const tgl=(k,l)=>`<div class="row" style="justify-content:space-between"><span>${l}</span><button class="tl" data-a="tg" data-v="${k}" aria-pressed="${!!ST[k]}">${ST[k]?'✓ Ligado':'✕ Desligado'}</button></div>`;
const hd=t=>`<button class="tl" data-a="ov" data-v="set" style="align-self:flex-start">← Configurações</button><div class="logo" style="font-size:calc(30px*min(var(--f),1.1))">${t}</div>`;
const pv=()=>{const t=themeOf(DR);return `<div class="pvw" id="pv" style="${vs(t)}"><div class="logo" style="font-size:calc(26px*min(var(--f),1.1))">${[...'JotaPhone'].map((c,i)=>`<span style="color:${t.logo[i%4]}">${c}</span>`).join('')}</div><div class="card row">${av(me.av,40)}<b>${esc(me.name||'Jogador')}</b></div><button class="b g sm" tabindex="-1">Botão principal</button><button class="b y sm" tabindex="-1">Botão secundário</button></div>`};
const SN={ex:'🎨 Exibição',ac:'♿ Acessibilidade',so:'🔊 Som e vibração',pe:'👤 Perfil',ab:'ℹ️ Sobre'};
const SET={
 set:()=>`<button class="tl" data-a="cl" style="align-self:flex-start">← Fechar</button><div class="logo" style="font-size:calc(32px*min(var(--f),1.1))">CONFIGURAÇÕES</div>${Object.keys(SN).map((k,i)=>`<button class="b ${['g','y','p','g','y'][i]}" data-a="ov" data-v="set-${k}">${SN[k]}</button>`).join('')}`,
 'set-ex':()=>`${hd('EXIBIÇÃO')}<div class="card"><b>Tema</b><div class="tools" style="margin:8px 0">${[['light','☀️ Claro'],['dark','🌙 Escuro'],['auto','📱 Automático'],['custom','🎨 Personalizado']].map(([v,l])=>chip('th','th',v,l,DR.id)).join('')}</div><b>Temas prontos</b><div class="tools" style="margin:8px 0">${Object.entries(P).map(([v,q])=>chip('th','th',v,q.e+' '+q.n,DR.id)).join('')}</div><b>Tema personalizado</b><label>Cor principal</label><input type="color" id="c1" value="${DR.c1}"><label>Cor secundária</label><input type="color" id="c2" value="${DR.c2}"></div><b>Prévia</b>${pv()}<button class="b g" data-a="ap">APLICAR TEMA</button><div class="card"><b>Tamanho da fonte</b><div class="tools" style="margin-top:8px">${['Pequena','Normal','Grande','Muito grande'].map((l,i)=>chip('fs','fs',i,l,ST.font)).join('')}</div></div>`,
 'set-ac':()=>`${hd('ACESSIBILIDADE')}<div class="card"><b>Visão de cores</b><div class="tools" style="margin:8px 0">${[['std','Padrão'],['pro','Protanopia'],['deu','Deuteranopia'],['tri','Tritanopia'],['hc','Alto contraste']].map(([v,l])=>chip('cb','cb',v,l,ST.cb)).join('')}</div><div class="row" style="gap:12px;flex-wrap:wrap"><span class="ok">✓ Sucesso</span><span class="bad">✕ Erro</span></div><p style="margin:8px 0 0;font-size:calc(14px*var(--f))">O JotaPhone sempre combina cores com ícones, textos e bordas.</p></div><div class="card">${tgl('calm','Reduzir animações')}</div>`,
 'set-so':()=>`${hd('SOM E VIBRAÇÃO')}<div class="card" style="display:grid;gap:12px">${tgl('snd','Som dos botões')}${tgl('vib','Vibração ao tocar')}${tgl('vibEnd','Vibração ao fim do tempo')}${tgl('vibJoin','Vibração quando jogador entrar')}</div>`,
 'set-pe':()=>`${hd('PERFIL')}<div class="card c">${av(me.av,96)}<input id="pn" maxlength="14" placeholder="Seu nome" value="${esc(me.name)}" style="margin-top:10px;text-align:center"><p style="font-size:calc(14px*var(--f));margin:0 0 4px">A mudança vale a partir da próxima sala.</p><p style="font-size:calc(13px*var(--f));margin:0 0 8px">Seu ID: <b>${esc(me.id||'será criado ao digitar o nome')}</b></p><div class="avs">${AV.map((a,i)=>`<div class="av${i===me.av?' sel':''}" data-a="av" data-v="${i}">${a}</div>`).join('')}</div></div>`,
 'set-ab':()=>`${hd('SOBRE')}<div class="card c"><div class="mas">${MAS}</div><b style="font-size:calc(24px*var(--f))">JotaPhone</b><p>Desenhe. Adivinhe. E veja onde isso vai parar!</p><p style="opacity:.7;font-size:calc(14px*var(--f));margin:0">Protótipo v1.3 · local + online</p></div>`};
const updPv=()=>{const p=$('#pv');if(p)p.outerHTML=pv()};
Object.assign(A,{cfg(){ov='set';render()},cl(){ov=null;render()},ov(v){if(v==='set-ex')DR={id:ST.theme,c1:ST.c1,c2:ST.c2};ov=v;render()},
 th(v,t){DR.id=v;sl(t,'th');updPv()},ap(){ST.theme=DR.id;ST.c1=DR.c1;ST.c2=DR.c2;save();applyT();rr();toast('✓ Tema aplicado!')},
 fs(v){ST.font=+v;save();applyT();rr()},cb(v){ST.cb=v;save();applyT();rr()},tg(v){ST[v]=ST[v]?0:1;save();if(v==='calm')applyT();rr()}});
app.onclick=e=>{const t=e.target.closest('[data-a]');if(t){if(t.matches('.b,.tl,.sw')){snd();buzz(12,'vib')}A[t.dataset.a](t.dataset.v,t)}};
app.oninput=e=>{const t=e.target;if(t.id==='nm'||t.id==='pn'){me.name=t.value;ST.nm=t.value;if(me.name.trim()){if(!me.id&&window.JotaPlayer)me.id=JotaPlayer.criarIdJogador();if(window.JotaPlayer)JotaPlayer.salvarNomeJogador(me.name)}save()}if(t.id==='c1'||t.id==='c2'){DR[t.id]=t.value;DR.id='custom';updPv();sl(document.querySelector('[data-v=custom]'),'th')}if(t.id==='tx')$('#ct').textContent=t.value.length+'/60'};
if(me.name.trim()&&!me.id&&window.JotaPlayer)me.id=JotaPlayer.criarIdJogador();
if(me.name.trim()&&window.JotaPlayer)JotaPlayer.salvarNomeJogador(me.name);
